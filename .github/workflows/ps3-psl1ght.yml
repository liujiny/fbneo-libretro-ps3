name: CI FBNeo PS3 PSL1GHT

on:
  workflow_dispatch:

  repository_dispatch:
    types:
      - run_build

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: reallibretroretroarch/libretro-build-psl1ght:latest
      options: --user root

    steps:

      # ==========================================================
      # 1. Checkout FBNeo
      #
      # Workflow itself lives on main.
      # The source being compiled is explicitly source-main.
      # ==========================================================

      - name: Checkout FBNeo source-main
        uses: actions/checkout@v4
        with:
          ref: source-main
          fetch-depth: 1

      # ==========================================================
      # 2. Checkout RetroArch
      #
      # Pin RetroArch while porting so upstream changes don't
      # randomly affect our debugging.
      # ==========================================================

      - name: Checkout RetroArch
        uses: actions/checkout@v4
        with:
          repository: libretro/RetroArch
          ref: 639eb216a61c8a600a000a5e7eb2e2c254f4f4f3
          path: retroarch
          fetch-depth: 1

      # ==========================================================
      # 3. Fix Git safe.directory
      #
      # GitHub Actions checkout configures safe.directory using
      # a temporary HOME. Inside the job container HOME changes,
      # so Git may otherwise report:
      #
      # fatal: detected dubious ownership
      # ==========================================================

      - name: Mark repositories as safe
        shell: bash
        run: |
          set -e

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/retroarch"

          echo "Configured Git safe directories:"
          git config --global --get-all safe.directory

      # ==========================================================
      # 4. Prepare directories and diagnostics
      # ==========================================================

      - name: Prepare diagnostics
        shell: bash
        run: |
          set -eu

          mkdir -p "$GITHUB_WORKSPACE/ci-logs"
          mkdir -p "$GITHUB_WORKSPACE/dist/cores"
          mkdir -p "$GITHUB_WORKSPACE/dist/salamander"

          {
            echo "========================================"
            echo "PSL1GHT environment"
            echo "========================================"

            echo "PS3DEV=${PS3DEV:-<unset>}"
            echo "PSL1GHT=${PSL1GHT:-<unset>}"
            echo "PORTLIBS=${PORTLIBS:-<unset>}"

            echo

            echo "========================================"
            echo "PATH"
            echo "========================================"

            echo "$PATH"

            echo

            echo "========================================"
            echo "Toolchain"
            echo "========================================"

            command -v ppu-gcc || true
            command -v ppu-g++ || true
            command -v ppu-ar || true
            command -v ppu-nm || true
            command -v ppu-strip || true
            command -v make || true

            echo

            ppu-gcc --version || true

            echo

            echo "========================================"
            echo "Source revisions"
            echo "========================================"

            echo "FBNeo branch:"
            git branch --show-current || true

            echo "FBNeo commit:"
            git rev-parse HEAD

            echo

            echo "RetroArch branch:"
            git -C retroarch branch --show-current || true

            echo "RetroArch commit:"
            git -C retroarch rev-parse HEAD

            echo

            echo "========================================"
            echo "PSL1GHT directories"
            echo "========================================"

            ls -ld /opt/ps3dev || true
            ls -ld /opt/ps3dev/ppu || true

            echo

            find /opt/ps3dev \
              -maxdepth 3 \
              -type d \
              \( -name include -o -name lib \) \
              2>/dev/null \
              | sort \
              | head -100 \
              || true

          } 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/environment.log"

          echo
          echo "Checking required environment..."

          test -n "${PS3DEV:-}"
          test -n "${PSL1GHT:-}"

          command -v ppu-gcc >/dev/null
          command -v ppu-g++ >/dev/null
          command -v ppu-ar >/dev/null

      # ==========================================================
      # 5. Clean FBNeo
      # ==========================================================

      - name: Clean FBNeo PSL1GHT core
        working-directory: src/burner/libretro
        shell: bash
        run: |
          set -o pipefail

          make \
            platform=psl1ght \
            COMMONLV= \
            clean \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/fbneo-clean.log"

      # ==========================================================
      # 6. Build FBNeo static Libretro core
      #
      # PSL1GHT tools are:
      #
      # ppu-gcc
      # ppu-g++
      # ppu-ar
      #
      # therefore COMMONLV must be empty.
      #
      # Result expected:
      #
      # fbneo_libretro_psl1ght.a
      # ==========================================================

      - name: Compile FBNeo PSL1GHT static core
        working-directory: src/burner/libretro
        shell: bash
        run: |
          set -o pipefail

          make \
            platform=psl1ght \
            COMMONLV= \
            -j"$(getconf _NPROCESSORS_ONLN)" \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/fbneo-build.log"

          echo
          echo "========================================"
          echo "FBNeo build output"
          echo "========================================"

          test -s fbneo_libretro_psl1ght.a

          ls -lh fbneo_libretro_psl1ght.a \
            | tee -a "$GITHUB_WORKSPACE/ci-logs/fbneo-build.log"

      # ==========================================================
      # 7. Inspect generated archive
      # ==========================================================

      - name: Inspect FBNeo archive
        working-directory: src/burner/libretro
        shell: bash
        run: |
          set -o pipefail

          {
            echo "========================================"
            echo "Archive"
            echo "========================================"

            ls -lh fbneo_libretro_psl1ght.a

            echo

            echo "========================================"
            echo "Expected Libretro symbols"
            echo "========================================"

            if command -v ppu-nm >/dev/null 2>&1; then

              ppu-nm \
                -g \
                --defined-only \
                fbneo_libretro_psl1ght.a \
                | grep -E \
                'retro_(init|deinit|run|load_game|get_system_info|get_system_av_info)$' \
                || true

            else

              echo "ppu-nm unavailable"

            fi

          } 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/fbneo-symbols.log"

      # ==========================================================
      # 8. Copy FBNeo archive into RetroArch
      #
      # RetroArch Makefile.psl1ght expects:
      #
      # -lretro_psl1ght
      #
      # therefore:
      #
      # libretro_psl1ght.a
      # ==========================================================

      - name: Install FBNeo into RetroArch
        shell: bash
        run: |
          set -eu

          cp \
            src/burner/libretro/fbneo_libretro_psl1ght.a \
            retroarch/libretro_psl1ght.a

          cp \
            src/burner/libretro/fbneo_libretro_psl1ght.a \
            dist/cores/fbneo_libretro_psl1ght.a

          echo "Installed FBNeo archive:"

          ls -lh \
            retroarch/libretro_psl1ght.a \
            dist/cores/fbneo_libretro_psl1ght.a

      # ==========================================================
      # 9. Clean RetroArch
      # ==========================================================

      - name: Clean RetroArch PSL1GHT frontend
        working-directory: retroarch
        shell: bash
        run: |
          set -o pipefail

          make \
            -f Makefile.psl1ght \
            clean \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/retroarch-clean.log"

      # ==========================================================
      # 10. Link RetroArch + FBNeo
      #
      # IMPORTANT:
      #
      # DO NOT use:
      #
      # HAVE_STATIC_DUMMY=1
      #
      # We need the real FBNeo archive linked into this SELF.
      # ==========================================================

      - name: Link RetroArch plus FBNeo SELF
        working-directory: retroarch
        shell: bash
        run: |
          set -o pipefail

          make \
            -f Makefile.psl1ght \
            -j"$(getconf _NPROCESSORS_ONLN)" \
            info \
            all \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/retroarch-fbneo-link.log"

          echo
          echo "========================================"
          echo "RetroArch + FBNeo output"
          echo "========================================"

          test -s retroarch_psl1ght.elf
          test -s retroarch_psl1ght.self

          cp \
            retroarch_psl1ght.elf \
            "$GITHUB_WORKSPACE/dist/cores/fbneo_libretro_psl1ght.elf"

          cp \
            retroarch_psl1ght.self \
            "$GITHUB_WORKSPACE/dist/cores/fbneo_libretro_psl1ght.SELF"

          ls -lh \
            "$GITHUB_WORKSPACE/dist/cores/fbneo_libretro_psl1ght.elf" \
            "$GITHUB_WORKSPACE/dist/cores/fbneo_libretro_psl1ght.SELF" \
            | tee -a "$GITHUB_WORKSPACE/ci-logs/retroarch-fbneo-link.log"

      # ==========================================================
      # 11. Clean Salamander
      # ==========================================================

      - name: Clean Salamander
        working-directory: retroarch
        shell: bash
        run: |
          set -o pipefail

          make \
            -f Makefile.psl1ght.salamander \
            clean \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/salamander-clean.log"

      # ==========================================================
      # 12. Build Salamander launcher
      # ==========================================================

      - name: Compile Salamander
        working-directory: retroarch
        shell: bash
        run: |
          set -o pipefail

          make \
            -f Makefile.psl1ght.salamander \
            -j"$(getconf _NPROCESSORS_ONLN)" \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/salamander-build.log"

          echo
          echo "========================================"
          echo "Collect Salamander files"
          echo "========================================"

          if [ -f retroarch_psl1ght_salamander.elf ]; then
            cp \
              retroarch_psl1ght_salamander.elf \
              "$GITHUB_WORKSPACE/dist/salamander/"
          fi

          if [ -f retroarch_psl1ght_salamander_nonstripped.elf ]; then
            cp \
              retroarch_psl1ght_salamander_nonstripped.elf \
              "$GITHUB_WORKSPACE/dist/salamander/"
          fi

          if [ -f pkg/psl1ght/pkg/USRDIR/EBOOT.BIN ]; then
            cp \
              pkg/psl1ght/pkg/USRDIR/EBOOT.BIN \
              "$GITHUB_WORKSPACE/dist/salamander/"
          fi

          find \
            "$GITHUB_WORKSPACE/dist/salamander" \
            -maxdepth 1 \
            -type f \
            -exec ls -lh {} \; \
            | tee -a "$GITHUB_WORKSPACE/ci-logs/salamander-build.log"

      # ==========================================================
      # 13. Generate final diagnostic information
      # ==========================================================

      - name: Final diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo "========================================"
            echo "Final files"
            echo "========================================"

            if [ -d dist ]; then

              find \
                dist \
                -type f \
                -printf '%p  %s bytes\n' \
                | sort

            fi

          } 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/final-files.log"

      # ==========================================================
      # 14. GitHub Actions summary
      # ==========================================================

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "# FBNeo PS3 / PSL1GHT build"
            echo

            echo "## Source"
            echo

            echo "FBNeo branch:"
            echo "\`source-main\`"
            echo

            echo "FBNeo commit:"
            echo "\`${GITHUB_SHA}\`"
            echo

            echo "RetroArch commit:"
            echo "\`639eb216a61c8a600a000a5e7eb2e2c254f4f4f3\`"
            echo

            echo "## Produced files"
            echo

            if [ -d dist ]; then

              find \
                dist \
                -type f \
                -printf '%p  %s bytes\n' \
                | sort

            fi

            echo
            echo "If the job failed, send the GitHub Actions job URL to ChatGPT."

          } >> "$GITHUB_STEP_SUMMARY"

      # ==========================================================
      # 15. Always upload diagnostic logs
      #
      # This still runs after a compiler/linker failure.
      # ==========================================================

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FBNeo-PS3-PSL1GHT-logs-${{ github.run_number }}
          if-no-files-found: warn
          path: ci-logs/

      # ==========================================================
      # 16. Upload successful build
      # ==========================================================

      - name: Upload PS3 PSL1GHT build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FBNeo-PS3-PSL1GHT-build-${{ github.run_number }}
          if-no-files-found: error
          path: dist/
